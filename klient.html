<title>FitQuest — Клиент</title><style>

</style></head><body><header><b>klient.html</b><button id="themeBtn" onclick="cycleTheme()">🌗</button></header><main id="app"></main><div class="nav" id="clnav"></div><script>var NAVS=[["quests","🎯","Квесты"],["schedule","📅","Расписание"],["shop","🎁","Лавка"],["prog","📈","Прогресс"],["chat","💬","Чат"]];function buildNav(){var n=document.getElementById("clnav");n.innerHTML=NAVS.map(function(x){return '<span data-t="'+x[0]+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+"<br>"+x[2]+"</span>";}).join("");}window.addEventListener("load",function(){applyTheme();buildNav();var s=localStorage.getItem(SESSION_KEY);if(s&&DB.users[s]&&DB.users[s].role==="client")USER_KEY=s;render();});</script><script>

/* ===== theme ===== */
function applyTheme(){
  var m=localStorage.getItem(THEME_KEY)||'auto';
  var dark;
  if(m==='dark') dark=true; else if(m==='light') dark=false; else { var h=new Date().getHours(); dark=(h<8||h>=20); }
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  var b=document.getElementById('themeBtn');
  if(b) b.textContent = m==='auto' ? '🌗' : (dark?'🌙':'☀️');
}
function cycleTheme(){
  var m=localStorage.getItem(THEME_KEY)||'auto';
  m = m==='light'?'dark':(m==='dark'?'auto':'light');
  localStorage.setItem(THEME_KEY,m); applyTheme();
  toast('Оформление: '+(m==='light'?'светлое':m==='dark'?'тёмное':'авто'));
}

/* ===== ui helpers ===== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmtMoney(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₽'; }
function fmtDate(ts){ var d=new Date(ts); return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }
function fmtDT(ts){ var d=new Date(ts); return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function toast(msg){
  var t=document.createElement('div'); t.textContent=msg;
  t.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:9999;opacity:0;transition:opacity .2s;';
  document.body.appendChild(t); requestAnimationFrame(function(){t.style.opacity=1;});
  setTimeout(function(){ t.style.opacity=0; setTimeout(function(){t.remove();},300); },2200);
}
function daysBetween(a,b){ return Math.floor((b-a)/86400000); }

/* ===== CLIENT APP ===== */
var USER_KEY=null, tab='quests';

function login(){
  var u=document.getElementById('luser').value.trim().toLowerCase(), p=document.getElementById('lpass').value;
  var rec=DB.users[u];
  if(rec && rec.role==='client' && rec.pass===p){ USER_KEY=u; save(SESSION_KEY,u); DB.users[u].lastActive=Date.now(); saveDB(); render(); }
  else toast('Неверный логин или пароль');
}
function register(){
  var n=document.getElementById('rname').value.trim();
  var code=document.getElementById('rcode').value.trim().toUpperCase();
  var u=document.getElementById('ruser').value.trim().toLowerCase();
  var p=document.getElementById('rpass').value;
  if(!n||!u||!p){ toast('Заполните все поля'); return; }
  if(code!==String(CFG.inviteCode).toUpperCase()){ toast('Неверный код тренера'); return; }
  if(DB.users[u]){ toast('Логин занят'); return; }
  DB.users[u]={role:'client',pass:p,name:n,phone:'',code:CFG.inviteCode,joined:Date.now(),notes:'',tags:[],subUntil:Date.now()+86400000*30,subLeft:16,frozen:false,blockLen:CFG.blockLen,xp:0,streak:0,lastActive:Date.now(),blockDone:0,discount:'—',quests:[]};
  saveDB(); USER_KEY=u; save(SESSION_KEY,u); render();
}
function logout(){ USER_KEY=null; save(SESSION_KEY,null); render(); }
function me(){ return DB.users[USER_KEY]; }

/* --- quests --- */
function questsView(){
  var c=me();
  var h='<h2>Квесты</h2>';
  h+='<div class="panel"><div class="row"><span>Серия</span><span>🔥 '+(c.streak||0)+' дн.</span></div>';
  h+='<div class="row"><span>XP</span><span>'+(c.xp||0)+'</span></div>';
  h+='<div class="row"><span>Блок</span><span>'+(c.blockDone||0)+'/'+(c.blockLen||CFG.blockLen)+'</span></div>';
  h+='<div class="bar"><div style="width:'+Math.min(100,100*(c.blockDone||0)/(c.blockLen||CFG.blockLen))+'%"></div></div>';
  if(c.discount&&c.discount!=='—') h+='<div class="tag ok">'+esc(c.discount)+'</div>';
  h+='</div>';
  var qs=(c.quests||[]).filter(function(q){return q.on;});
  qs.forEach(function(q){
    var sent=DB.reports.some(function(r){return r.user===USER_KEY&&r.quest===q.name&&r.status==='pending';});
    h+='<div class="card"><b>'+esc(q.name)+'</b> <span class="tag">'+({train:'тренировка',food:'питание',habit:'привычка'})[q.type]+'</span> <span class="tag">+'+q.xp+' XP</span>';
    h+='<div class="mut">'+esc(q.desc||'')+'</div>';
    h+= sent?'<span class="tag">⏳ на проверке</span>':'<button onclick="report(\''+q.id+'\')">Отчитаться</button>';
    h+='</div>';
  });
  if(!qs.length) h+='<p class="mut">Тренер ещё не назначил вам квесты</p>';
  return h;
}
function report(qid){
  var q=me().quests.filter(function(x){return x.id===qid;})[0]; if(!q)return;
  var text=prompt('Комментарий по квесту «'+q.name+'»:');
  if(text===null) return;
  DB.reports.push({id:uid(),user:USER_KEY,quest:q.name,xp:q.xp,text:text,ts:Date.now(),status:'pending'});
  me().lastActive=Date.now(); saveDB(); toast('Отчёт отправлен на проверку'); render();
}

/* --- schedule --- */
function schedView(){
  var c=me();
  var evs=DB.events.filter(function(e){return e.when>Date.now()-86400000;}).sort(function(a,b){return a.when-b.when;});
  var h='<h2>Расписание</h2>';
  h+='<div class="panel"><div class="row"><span>Абонемент до</span><span>'+fmtDate(c.subUntil||Date.now())+'</span></div>';
  h+='<div class="row"><span>Осталось посещений</span><span>'+(c.frozen?'заморожен':(c.subLeft||0))+'</span></div></div>';
  evs.forEach(function(e){
    var mine=(e.signed||[]).indexOf(USER_KEY)>=0;
    var full=(e.signed||[]).length>=(e.cap||1);
    var d=new Date(e.when);
    h+='<div class="card"><b>'+esc(e.title)+'</b> <span class="tag">'+(e.type==='pt'?'персональная':'групповая')+'</span>';
    h+='<div class="mut">'+d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+' · '+fmtMoney(e.price||0)+'</div>';
    h+='<div class="mut">Мест: '+((e.cap||1)-(e.signed||[]).length)+'</div>';
    if(e.type==='group'){
      if(mine) h+='<button onclick="cancelBook(\''+e.id+'\')">Отменить запись</button>';
      else if(full) h+='<span class="tag red">мест нет</span>';
      else h+='<button onclick="book(\''+e.id+'\')">Записаться</button>';
    } else if(mine) h+='<span class="tag ok">вы записаны</span>';
    h+='</div>';
  });
  if(!evs.length) h+='<p class="mut">Занятий пока нет</p>';
  return h;
}
function book(id){ var e=DB.events.filter(function(x){return x.id===id;})[0]; e.signed=e.signed||[]; e.signed.push(USER_KEY); me().subLeft=Math.max(0,(me().subLeft||0)-1); saveDB(); toast('Вы записаны'); render(); }
function cancelBook(id){ var e=DB.events.filter(function(x){return x.id===id;})[0]; e.signed=(e.signed||[]).filter(function(u){return u!==USER_KEY;}); me().subLeft=(me().subLeft||0)+1; saveDB(); toast('Запись отменена'); render(); }

/* --- shop --- */
function shopView(){
  var c=me();
  var h='<h2>Лавка наград</h2><div class="panel"><div class="row"><span>Ваш баланс</span><span><b>'+(c.xp||0)+' XP</b></span></div></div>';
  CFG.shop.forEach(function(s){
    var can=(c.xp||0)>=s.cost;
    h+='<div class="card"><b>'+esc(s.name)+'</b><div class="mut">'+s.cost+' XP</div>';
    h+= can?'<button onclick="buy(\''+s.id+'\')">Купить</button>':'<span class="mut">не хватает '+ (s.cost-(c.xp||0)) +' XP</span>';
    h+='</div>';
  });
  var bought=(DB.purchases||[]).filter(function(p){return p.user===USER_KEY;});
  if(bought.length){ h+='<div class="panel"><b>Мои награды</b>'; bought.forEach(function(p){ h+='<div class="row"><span>'+esc((CFG.shop.filter(function(s){return s.id===p.shop;})[0]||{}).name||'награда')+'</span><span class="tag ok">получено</span></div>'; }); h+='</div>'; }
  return h;
}
function buy(id){
  var s=CFG.shop.filter(function(x){return x.id===id;})[0]; if(!s)return;
  var c=me();
  if((c.xp||0)<s.cost){ toast('Не хватает XP'); return; }
  if(!confirm('Купить «'+s.name+'» за '+s.cost+' XP?'))return;
  c.xp-=s.cost;
  DB.purchases.push({id:uid(),user:USER_KEY,shop:id,ts:Date.now()}); saveDB();
  toast('Куплено! Покажите тренеру'); render();
}

/* --- progress --- */
function progView(){
  var c=me();
  var h='<h2>Прогресс</h2>';
  h+='<div class="panel"><b>Показатели</b>';
  h+='<div class="row"><span>Всего XP</span><span><b>'+(c.xp||0)+'</b></span></div>';
  h+='<div class="row"><span>Серия</span><span>🔥 '+(c.streak||0)+' дн.</span></div>';
  h+='<div class="row"><span>Блок</span><span>'+(c.blockDone||0)+'/'+(c.blockLen||CFG.blockLen)+'</span></div>';
  h+='<div class="row"><span>Скидка</span><span>'+esc(c.discount||'—')+'</span></div></div>';
  var ms=(DB.measures||[]).filter(function(m){return m.user===USER_KEY;}).sort(function(a,b){return a.ts-b.ts;});
  if(ms.length>1) h+='<div class="panel"><b>График веса</b><canvas id="wchart" width="320" height="160"></canvas></div>';
  var mine=DB.reports.filter(function(r){return r.user===USER_KEY;}).sort(function(a,b){return b.ts-a.ts;});
  h+='<div class="panel"><b>История отчётов</b>';
  mine.slice(0,15).forEach(function(r){
    h+='<div class="row"><span>'+esc(r.quest)+' · '+fmtDate(r.ts)+'</span><span class="tag '+(r.status==='approved'?'ok':r.status==='rejected'?'red':'')+'">'+(r.status==='approved'?'✓':r.status==='rejected'?'✕':'⏳')+'</span></div>';
  });
  if(!mine.length) h+='<div class="mut">Пока пусто</div>';
  h+='</div>';
  return h;
}
function drawWeightChart(){
  var cv=document.getElementById('wchart'); if(!cv)return;
  var ms=(DB.measures||[]).filter(function(m){return m.user===USER_KEY;}).sort(function(a,b){return a.ts-b.ts;});
  if(!ms.length)return;
  var ctx=cv.getContext('2d'),W=cv.width,H=cv.height,pad=20;
  var ws=ms.map(function(m){return m.weight;});
  var mn=Math.min.apply(null,ws)-1,mx=Math.max.apply(null,ws)+1;
  ctx.clearRect(0,0,W,H);
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  ctx.strokeStyle=dark?'#556':'#ccc'; ctx.fillStyle=dark?'#4fc3f7':'#1976d2';
  ws.forEach(function(w,i){
    var x=pad+(W-2*pad)*(ws.length===1?0.5:i/(ws.length-1));
    var y=H-pad-(H-2*pad)*((w-mn)/(mx-mn));
    if(i>0){ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke();}
    ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();
    var px=x,py=y;
  });
  ctx.fillText(String(Math.round(mx-1)),4,14); ctx.fillText(String(Math.round(mn+1)),4,H-6);
}

/* --- chat --- */
function chatBlock(peer,role){
  var meK=USER_KEY;
  var msgs=(DB.chats||[]).filter(function(m){ return (m.from===meK&&m.to===peer)||(m.from===peer&&m.to===meK); }).sort(function(a,b){return a.ts-b.ts;});
  var h='<div class="panel chat"><div class="msgs">';
  msgs.forEach(function(m){ h+='<div class="msg '+(m.from===meK?'me':'')+'"><b>'+(m.from===meK?'Вы':'Тренер')+'</b> '+esc(m.text)+'<div class="mut">'+fmtDT(m.ts)+'</div></div>'; });
  if(!msgs.length) h+='<div class="mut">Сообщений пока нет</div>';
  h+='</div><div class="chatrow"><input id="chat_'+peer+'" placeholder="Сообщение…" onkeydown="if(event.key===\'Enter\')sendChat(\''+peer+'\')"><button onclick="sendChat(\''+peer+'\')">➤</button></div></div>';
  return h;
}
function sendChat(peer){
  var inp=document.getElementById('chat_'+peer); var t=inp.value.trim(); if(!t)return;
  DB.chats=DB.chats||[];
  DB.chats.push({id:uid(),from:USER_KEY,to:'trainer',text:t,ts:Date.now()});
  saveDB(); inp.value=''; render();
}

/* --- render --- */
function rerender(){ render(); }
function render(){
  document.title=CFG.appName+' — Клиент';
  var el=document.getElementById('app');
  if(!USER_KEY){
    var urlCode=new URLSearchParams(location.search).get('code')||'';
    el.innerHTML='<div class="login"><h1>'+esc(CFG.appName)+'</h1>'+
      '<div class="panel"><b>Вход</b><label>Логин</label><input id="luser"><label>Пароль</label><input id="lpass" type="password" onkeydown="if(event.key===\'Enter\')login()"><button onclick="login()">Войти</button></div>'+
      '<div class="panel"><b>Регистрация по коду тренера</b><label>Имя</label><input id="rname"><label>Код тренера</label><input id="rcode" value="'+esc(urlCode)+'"><label>Придумайте логин</label><input id="ruser"><label>Придумайте пароль</label><input id="rpass" type="password"><button onclick="register()">Зарегистрироваться</button></div></div>';
    return;
  }
  var c=me();
  var nav=[['quests','🎯 Квесты'],['schedule','📅 Расписание'],['shop','🎁 Лавка'],['prog','📈 Прогресс'],['chat','💬 Чат']];
  var h='';
  if(tab==='quests') h=questsView();
  else if(tab==='schedule') h=schedView();
  else if(tab==='shop') h=shopView();
  else if(tab==='prog') h=progView();
  else if(tab==='chat') h=chatBlock('trainer','client');
  el.innerHTML='<div class="topbar"><b>'+esc(c.name||'')+'</b><span class="mut">'+(c.xp||0)+' XP · 🔥 '+(c.streak||0)+'</span><button class="ghost" onclick="logout()">Выйти</button></div>'+h;
  document.querySelectorAll('.nav span').forEach(function(s){ s.classList.toggle('on',s.dataset.t===tab); });
  drawWeightChart();
}
</script></body></html>
