<title>FitQuest — Тренер</title><style>
:root{ --bg:#f2f3f7; --panel:#fff; --text:#1c1e26; --mut:#8a8fa3; --acc:#2962ff; --line:#e6e8ef; --ok:#1a9e55; --red:#d94343; --bar:#2962ff; }

*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font:15px -apple-system,'Segoe UI',Roboto,sans-serif;}
header{background:var(--panel);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 1px 4px rgba(0,0,0,.06);}
header b{font-size:17px;}
#themeBtn{background:none;border:none;font-size:20px;cursor:pointer;}
main{max-width:640px;margin:0 auto;padding:14px 14px 80px;}
h2{font-size:20px;margin:14px 0 10px;}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px;}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font-size:15px;margin-bottom:6px;}
button{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;margin:4px 6px 4px 0;}
button.danger{background:var(--red);}
button.ghost{background:var(--line);color:var(--text);}
.card{background:var(--panel);border-radius:14px;padding:14px;margin:8px 0;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.panel{background:var(--panel);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.mut{color:var(--mut);font-size:13px;}
.big{font-size:26px;font-weight:700;}
.cards4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;}
.cards4 .card{margin:0;}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);gap:8px;font-size:14px;cursor:pointer;}
.row:last-child{border-bottom:none;}
.row:hover{opacity:.85;}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;background:var(--line);color:var(--mut);}
.tag.red{background:#fdecea;color:#c0392b;}
.tag.ok{background:#e6f6ec;color:#1a7f4b;}
.delta.up{color:var(--ok);font-size:12px;} .delta.down{color:var(--red);font-size:12px;}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0;}
.bar>div{height:100%;background:var(--bar);border-radius:4px;transition:width .3s;}
.filters{display:flex;gap:8px;margin:10px 0;align-items:center;}
.filters input,.filters select{flex:1;margin:0;}
.tabsm{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding:4px;background:var(--panel);border-radius:12px;}
.tabsm span{padding:7px 14px;border-radius:9px;cursor:pointer;font-size:14px;white-space:nowrap;color:var(--mut);}
.tabsm span.on{background:var(--acc);color:#fff;}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);display:flex;justify-content:space-around;padding:6px 0 10px;box-shadow:0 -2px 8px rgba(0,0,0,.08);z-index:10;}
.nav span{font-size:11px;cursor:pointer;color:var(--mut);padding:4px 8px;border-radius:8px;text-align:center;}
.nav span.on{color:var(--acc);font-weight:700;}
.login{max-width:400px;margin:20px auto;}
.chat .msgs{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.msg{background:var(--line);border-radius:12px;padding:8px 12px;max-width:85%;align-self:flex-start;font-size:14px;}
.msg.me{background:var(--acc);color:#fff;align-self:flex-end;}
.msg.me .mut{color:rgba(255,255,255,.7);}
.chatrow{display:flex;gap:8px;margin-top:10px;}
.chatrow input{flex:1;margin:0;}
.chatrow button{margin:0;padding:10px 14px;}
.switch{position:relative;display:inline-block;width:44px;height:24px;vertical-align:middle;}
.switch input{opacity:0;width:0;height:0;}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:12px;transition:.2s;}
.switch i:before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;left:3px;top:3px;background:#fff;transition:.2s;}
.switch input:checked+i{background:var(--ok);}
.switch input:checked+i:before{left:23px;}
canvas{max-width:100%;}
</style></head><body><header><b>trener.html</b><span id="hdrbtns"><button class="ghost" id="logoutBtn" onclick="logout()" style="display:none;padding:6px 12px;">Выйти</button><button id="themeBtn" onclick="cycleTheme()">🌗</button></span></header><main id="app"></main><div class="nav" id="trnav"></div><script>var NAVS=[["dash","📊","Дашборд"],["clients","👥","Клиенты"],["schedule","📅","Расписание"],["checks","✅","Проверки"],["finance","💰","Финансы"],["shop","🎁","Лавка"],["settings","⚙️","Настройки"]];function buildNav(){var n=document.getElementById("trnav");n.innerHTML=NAVS.map(function(x){return '<span data-t="'+x[0]+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+"<br>"+x[2]+"</span>";}).join("");}window.addEventListener("load",function(){applyTheme();buildNav();if(localStorage.getItem(SESSION_KEY)==="trainer")user="trainer";render();});</script><script>
/* ===== FitQuest core ===== */
window.__fq_error = null;

  try{
    var d = document.getElementById('errbox');
    if(!d){ d = document.createElement('div'); d.id='errbox';
      d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#c0392b;color:#fff;font:12px monospace;padding:10px;white-space:pre-wrap;max-height:40vh;overflow:auto;';
      (document.body||document.documentElement).appendChild(d);}
    d.textContent += 'ERROR: '+e.message+' @ line '+e.lineno+'\n';
  }catch(_){}
});

var FIREBASE_CONFIG = { apiKey:"", authDomain:"", databaseURL:"", projectId:"", appId:"" };
var CFG_KEY='fq_cfg', DATA_KEY='fq_data', SESSION_KEY='fq_session', THEME_KEY='fq_theme';

var DEF_CFG = {
  appName:'FitQuest', inviteCode:'FIT2026',
  discountHalf:10, discountFull:15, blockLen:42,
  xpTrain:50, xpFood:30, xpHabit:20, streakBonus:20, streakEvery:3,
  warnDays:5,
  shop:[{id:'s1',name:'Скидка 5%',cost:200},{id:'s2',name:'Фитнес-браслет',cost:1500},{id:'s3',name:'Бесплатная персоналка',cost:800}],
  tariffs:[{id:'t1',name:'Индивидуальная',price:2500},{id:'t2',name:'Онлайн',price:1800}]
};

function load(k,def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
var CFG = Object.assign({}, DEF_CFG, load(CFG_KEY,{}));
var DB = load(DATA_KEY,null);
if(!DB){
  DB = { users:{ trainer:{role:'trainer',pass:'1234'} }, sessions:[], reports:[], chats:[], events:[], payments:[], purchases:[], measures:[], nextId:1 };
  seedDemo();
}
function uid(){ return 'x'+(DB.nextId++)+'_'+Date.now().toString(36); }
function saveDB(){ save(DATA_KEY,DB); }

function seedDemo(){

  DB.users['ivan']={role:'client',pass:'1234',name:'Иван Петров',phone:'+7 900 444-55-66',code:'FIT2026',joined:Date.now()-86400000*10,notes:'',tags:['набор массы'],subUntil:Date.now()+86400000*40,subLeft:25,frozen:false,blockLen:42,xp:150,streak:0,lastActive:Date.now()-86400000*7,blockDone:2,discount:'—'};
  DB.users.anna.quests=[

    {id:'q3',name:'10 000 шагов',desc:'Ежедневно',type:'habit',xp:20,on:true}];
  DB.users.ivan.quests=[
    {id:'q4',name:'Тренировка верх тела',desc:'Жим, тяга, 60 минут',type:'train',xp:50,on:true},
    {id:'q5',name:'Профицит калорий',desc:'+300 ккал к норме',type:'food',xp:30,on:true}];
  var t=Date.now();
  DB.events.push({id:uid(),title:'Пилатес и укрепление спины',type:'group',when:t+86400000,cap:8,price:900,signed:['anna','ivan']});
  DB.events.push({id:uid(),title:'Персоналка: Анна',type:'pt',when:t+86400000*2,cap:1,price:2500,signed:['anna'],paid:{anna:true}});
  DB.reports.push({id:uid(),user:'anna',quest:'Тренировка в зале',text:'Сделала 3х15, тяжело но норм',ts:t-3600000,status:'pending'});
  DB.payments.push({id:uid(),user:'anna',amount:2500,tariff:'Индивидуальная',ts:t-86400000*3,event:null});
  DB.measures.push({id:uid(),user:'anna',weight:64.5,waist:74,ts:t-86400000*20});
  DB.measures.push({id:uid(),user:'anna',weight:63.1,waist:72,ts:t-86400000*5});
  saveDB();
}

/* ===== theme ===== */
function applyTheme(){
  var m=localStorage.getItem(THEME_KEY)||'auto';
  var dark;
  if(m==='dark') dark=true; else if(m==='light') dark=false; else { var h=new Date().getHours(); dark=(h<8||h>=20); }
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  var b=document.getElementById('themeBtn');
  if(b) b.textContent = m==='auto' ? '🌗' : (dark?'🌙':'☀️');
}
function cycleTheme(){
  var m=localStorage.getItem(THEME_KEY)||'auto';
  m = m==='light'?'dark':(m==='dark'?'auto':'light');
  localStorage.setItem(THEME_KEY,m); applyTheme();
  toast('Оформление: '+(m==='light'?'светлое':m==='dark'?'тёмное':'авто'));
}

/* ===== ui helpers ===== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmtMoney(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₽'; }
function fmtDate(ts){ var d=new Date(ts); return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }
function fmtDT(ts){ var d=new Date(ts); return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function toast(msg){
  var t=document.createElement('div'); t.textContent=msg;
  t.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:9999;opacity:0;transition:opacity .2s;';
  document.body.appendChild(t); requestAnimationFrame(function(){t.style.opacity=1;});
  setTimeout(function(){ t.style.opacity=0; setTimeout(function(){t.remove();},300); },2200);
}
function daysBetween(a,b){ return Math.floor((b-a)/86400000); }

/* ===== TRAINER APP ===== */
var user=null, tab='dash', curClient=null, curSub='profile', finMonth=(new Date()).getMonth(), finYear=(new Date()).getFullYear(), finFilter='all';

function login(){
  var u=document.getElementById('luser').value.trim(), p=document.getElementById('lpass').value;
  if(u==='trainer' && p==='1234'){ user='trainer'; save(SESSION_KEY,'trainer'); render(); }
  else toast('Неверный логин или пароль');
}
function logout(){ user=null; save(SESSION_KEY,null); render(); }

function clients(){ return Object.keys(DB.users).filter(function(k){return DB.users[k].role==='client';}).map(function(k){ return Object.assign({key:k},DB.users[k]); }); }
function clientName(k){ return (DB.users[k]&&DB.users[k].name)||k; }

/* --- dashboard --- */
function dashboard(){
  var cs=clients(), now=Date.now();
  var pending=DB.reports.filter(function(r){return r.status==='pending';}).length;
  var rev=monthRevenue(finYear,finMonth);
  var warn=cs.filter(function(c){
    if(c.frozen) return false;
    return daysBetween(c.lastActive||0,now) >= CFG.warnDays;
  });
  var expiring=cs.filter(function(c){ return !c.frozen && (c.subUntil||0)-now < 86400000*7 && (c.subUntil||0)>now; });
  var top=cs.slice().sort(function(a,b){return (b.xp||0)-(a.xp||0);}).slice(0,5);
  var h='<h2>Дашборд</h2><div class="cards4">';
  h+='<div class="card"><div class="mut">Клиенты</div><div class="big">'+cs.length+'</div></div>';
  h+='<div class="card"><div class="mut">Ждут проверки</div><div class="big">'+pending+'</div></div>';
  h+='<div class="card"><div class="mut">Выручка за месяц</div><div class="big">'+fmtMoney(rev.sum)+'</div><div class="delta '+(rev.delta>=0?'up':'down')+'">'+(rev.delta>=0?'▲ +':'▼ ')+rev.delta+'% чем 30 дней назад</div></div>';
  h+='<div class="card"><div class="mut">Ждёт оплаты</div><div class="big">'+fmtMoney(unpaidSum())+'</div></div></div>';
  h+='<div class="panel"><b>Риск отвала</b>'+(warn.length?'':' — все активны 👍');
  warn.forEach(function(c){ h+='<div class="row" onclick="openClient(\''+c.key+'\')"><span>'+esc(c.name)+'</span><span class="tag red">'+daysBetween(c.lastActive||0,now)+' дн. тишины</span></div>'; });
  h+='</div>';
  if(expiring.length){ h+='<div class="panel"><b>Абонемент истекает</b>'; expiring.forEach(function(c){ h+='<div class="row" onclick="openClient(\''+c.key+'\')"><span>'+esc(c.name)+'</span><span>'+fmtDate(c.subUntil)+'</span></div>'; }); h+='</div>'; }
  h+='<div class="panel"><b>Топ по XP</b>'; top.forEach(function(c){ h+='<div class="row"><span>'+esc(c.name)+'</span><span>'+(c.xp||0)+' XP</span></div>'; }); h+='</div>';
  return h;
}

/* --- clients --- */
function clientsList(){
  var q=(document.getElementById('csearch')?document.getElementById('csearch').value.toLowerCase():'');
  var tf=(document.getElementById('ctag')?document.getElementById('ctag').value:'');
  var cs=clients().filter(function(c){
    var okq=!q || c.name.toLowerCase().indexOf(q)>=0 || (c.phone||'').indexOf(q)>=0;
    var okt=!tf || (c.tags||[]).indexOf(tf)>=0;
    return okq&&okt;
  });
  var tags=[]; cs.forEach(function(c){ (c.tags||[]).forEach(function(t){ if(tags.indexOf(t)<0)tags.push(t); }); });
  var h='<h2>Клиенты</h2><div class="filters"><input id="csearch" placeholder="Имя или телефон" value="'+esc(q)+'" oninput="rerender()">';
  h+='<select id="ctag" onchange="rerender()"><option value="">Все теги</option>'+tags.map(function(t){return '<option '+(tf===t?'selected':'')+'>'+esc(t)+'</option>';}).join('')+'</select></div>';
  cs.forEach(function(c){
    var badge = c.frozen?'<span class="tag">заморозка</span>':((daysBetween(c.lastActive||0,Date.now())>=CFG.warnDays)?'<span class="tag red">риск отвала</span>':'');
    h+='<div class="card" onclick="openClient(\''+c.key+'\')"><b>'+esc(c.name)+'</b> '+badge+'<div class="mut">'+esc(c.phone||'')+' · '+(c.xp||0)+' XP · блок '+(c.blockDone||0)+'/'+(c.blockLen||CFG.blockLen)+'</div></div>';
  });
  h+='<button onclick="newClient()">+ Добавить клиента</button>';
  return h;
}
function openClient(k){ curClient=k; curSub='profile'; tab='client'; render(); }
function newClient(){
  var n=prompt('Имя клиента:'); if(!n)return;
  var ph=prompt('Телефон:','')||'';
  var key='c'+Date.now().toString(36);
  DB.users[key]={role:'client',pass:'1234',name:n,phone:ph,code:CFG.inviteCode,joined:Date.now(),notes:'',tags:[],subUntil:Date.now()+86400000*30,subLeft:16,frozen:false,blockLen:CFG.blockLen,xp:0,streak:0,lastActive:Date.now(),blockDone:0,discount:'—',quests:[]};
  saveDB(); openClient(key);
}
function clientCard(){
  var c=DB.users[curClient]; if(!c) return '<p>Клиент не найден</p>';
  var h='<button class="back" onclick="tab=\'clients\';render()">← Клиенты</button>';
  h+='<h2>'+esc(c.name)+'</h2>';
  h+='<div class="tabsm">'+['profile','quests','measures','payments','chat'].map(function(s){
    return '<span class="'+(curSub===s?'on':'')+'" onclick="curSub=\''+s+'\';render()">'+({profile:'Профиль',quests:'Квесты',measures:'Замеры',payments:'Оплаты',chat:'Чат'})[s]+'</span>';
  }).join('')+'</div>';
  if(curSub==='profile') h+=subProfile(c);
  if(curSub==='quests') h+=subQuests(c);
  if(curSub==='measures') h+=subMeasures(c);
  if(curSub==='payments') h+=subPayments(c);
  if(curSub==='chat') h+=chatBlock(curClient,'trainer');
  return h;
}
function subProfile(c){
  var link=location.href.split('?')[0].replace('trener.html','klient.html')+'?code='+encodeURIComponent(CFG.inviteCode);
  var h='<div class="panel"><b>Профиль</b>';
  h+='<div class="row"><span>Телефон</span><span>'+esc(c.phone||'—')+'</span></div>';
  h+='<div class="row"><span>Логин</span><span>'+esc(curClient)+' / пароль 1234</span></div>';
  h+='</div>';
  h+='<div class="panel"><b>Ссылка-приглашение</b><div class="mut">'+esc(link)+'</div><button onclick="copyLink()">Скопировать</button></div>';
  h+='<div class="panel"><b>Абонемент</b>';
  h+='<div class="row"><span>Действует до</span><span>'+fmtDate(c.subUntil||Date.now())+'</span></div>';
  h+='<div class="row"><span>Осталось посещений</span><span>'+(c.subLeft||0)+'</span></div>';
  h+='<button onclick="extendSub(\''+curClient+'\')">+30 дней</button> ';
  h+='<button onclick="toggleFreeze(\''+curClient+'\')">'+(c.frozen?'Разморозить':'Заморозить')+'</button>';
  h+='</div>';
  h+='<div class="panel"><b>Заметки тренера (только для вас)</b><textarea id="notes_'+curClient+'" rows="3">'+esc(c.notes||'')+'</textarea><button onclick="saveNotes(\''+curClient+'\')">Сохранить заметки</button></div>';
  h+='<div class="panel"><b>Теги</b><input id="tags_'+curClient+'" value="'+esc((c.tags||[]).join(', '))+'"><button onclick="saveTags(\''+curClient+'\')">Сохранить теги</button></div>';
  h+='<div class="panel"><b>Прогресс блока</b><div class="row"><span>Закрыто квестов</span><span>'+(c.blockDone||0)+' из '+(c.blockLen||CFG.blockLen)+'</span></div><div class="bar"><div style="width:'+Math.min(100,100*(c.blockDone||0)/(c.blockLen||CFG.blockLen))+'%"></div></div>';
  h+='<div class="row"><span>Скидка</span><span>'+esc(c.discount||'—')+'</span></div>';
  h+='<button onclick="resetBlock(\''+curClient+'\')">Сбросить блок</button></div>';
  return h;
}
function copyLink(){
  var link=location.href.split('?')[0].replace('trener.html','klient.html')+'?code='+encodeURIComponent(CFG.inviteCode);
  if(navigator.clipboard) navigator.clipboard.writeText(link).then(function(){toast('Ссылка скопирована');});
  else toast(link);
}
function extendSub(k){ DB.users[k].subUntil=(DB.users[k].subUntil||Date.now())+86400000*30; saveDB(); render(); }
function toggleFreeze(k){ DB.users[k].frozen=!DB.users[k].frozen; saveDB(); render(); }
function saveNotes(k){ DB.users[k].notes=document.getElementById('notes_'+k).value; saveDB(); toast('Сохранено'); }
function saveTags(k){ DB.users[k].tags=document.getElementById('tags_'+k).value.split(',').map(function(s){return s.trim();}).filter(Boolean); saveDB(); render(); }
function resetBlock(k){ DB.users[k].blockDone=0; DB.users[k].discount='—'; saveDB(); render(); }

function subQuests(c){
  var h='<div class="panel"><b>Квесты клиента</b>';
  (c.quests||[]).forEach(function(q){
    h+='<div class="card"><b>'+esc(q.name)+'</b> <span class="tag">'+({train:'тренировка',food:'питание',habit:'привычка'})[q.type]+'</span> <span class="tag">'+q.xp+' XP</span>'+(q.on?'':' <span class="tag red">выкл</span>');
    h+='<div class="mut">'+esc(q.desc||'')+'</div>';
    h+='<button onclick="toggleQuest(\''+curClient+'\',\''+q.id+'\')">'+(q.on?'Выключить':'Включить')+'</button> ';
    h+='<button onclick="editQuest(\''+curClient+'\',\''+q.id+'\')">Изменить</button> ';
    h+='<button class="danger" onclick="delQuest(\''+curClient+'\',\''+q.id+'\')">Удалить</button></div>';
  });
  h+='<button onclick="addQuest(\''+curClient+'\')">+ Добавить квест</button></div>';

function drawWeightChart(){
  var cv=document.getElementById('wchart'); if(!cv) return;
  var ms=(DB.measures||[]).filter(function(m){return m.user===curClient;}).sort(function(a,b){return a.ts-b.ts;});
  var ctx=cv.getContext('2d'), W=cv.width, H=cv.height, pad=20;
  var ws=ms.map(function(m){return m.weight;});
  var mn=Math.min.apply(null,ws)-1, mx=Math.max.apply(null,ws)+1;
  ctx.clearRect(0,0,W,H);
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  ctx.strokeStyle=dark?'#556':'#ccc'; ctx.fillStyle=dark?'#ccc':'#333';
  ws.forEach(function(w,i){
    var x=pad+(W-2*pad)*(ms.length===1?0.5:i/(ws.length-1));
    var y=H-pad-(H-2*pad)*((w-mn)/(mx-mn));
    if(i>0){ ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(x,y); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(x,y,3,0,7); ctx.fill();
    var px=x,py=y;
  });
  ctx.fillText(String(Math.round(mx-1)),4,14); ctx.fillText(String(Math.round(mn+1)),4,H-6);
}

  var r=DB.reports.filter(function(x){return x.id===id;})[0]; if(!r)return;
  r.status='approved';
  var u=DB.users[r.user]; if(u){
    u.xp=(u.xp||0)+(r.xp||0);
    u.blockDone=(u.blockDone||0)+1;
    u.lastActive=Date.now();
    var bl=u.blockLen||CFG.blockLen;
    if(u.blockDone>=bl){ u.discount='скидка '+CFG.discountFull+'%'; u.blockDone=0; toast('Блок закрыт! Скидка '+CFG.discountFull+'%'); }
    else if(u.blockDone>=Math.floor(bl/2)){ u.discount='скидка '+CFG.discountHalf+'%'; }
    u.streak=(u.streak||0)+1;
    if(u.streak%CFG.streakEvery===0){ u.xp+=CFG.streakBonus; toast('Бонус за серию: +'+CFG.streakBonus+' XP'); }
  }
  saveDB(); render();
}

/* --- finance --- */
function monthRevenue(y,m){
  var s=0;
  DB.payments.forEach(function(p){ var d=new Date(p.ts); if(d.getFullYear()===y&&d.getMonth()===m) s+=p.amount||0; });
  var pd=new Date(y,m-1,1); var ps=0;
  if(m===0) pd=new Date(y-1,11,1);
  DB.payments.forEach(function(p){ var d=new Date(p.ts); if(d.getFullYear()===pd.getFullYear()&&d.getMonth()===pd.getMonth()) ps+=p.amount||0; });
  var delta=ps>0?Math.round((s-ps)/ps*100):(s>0?100:0);
  return {sum:s,delta:delta};
}
function unpaidSum(){
  var s=0;
  DB.events.forEach(function(e){
    (e.signed||[]).forEach(function(u){ if(!(e.paid&&e.paid[u])) s+=e.price||0; });
  });
  return s;
}
function unpaidList(){
  var arr=[];
  DB.events.forEach(function(e){ (e.signed||[]).forEach(function(u){ if(!(e.paid&&e.paid[u])) arr.push({u:u,e:e}); }); });
  return arr;
}

  var mn=new Date(finYear,finMonth,1);
  var h='<h2>Финансы</h2>';
  h+='<div class="filters"><button onclick="shiftMonth(-1)">←</button><b>'+mn.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+'</b><button onclick="shiftMonth(1)">→</button></div>';
  h+='<div class="cards4"><div class="card"><div class="mut">Выручка</div><div class="big">'+fmtMoney(rev.sum)+'</div><div class="delta '+(rev.delta>=0?'up':'down')+'">'+(rev.delta>=0?'▲ +':'▼ ')+rev.delta+'%</div></div>';
  h+='<div class="card"><div class="mut">Ждёт оплаты</div><div class="big">'+fmtMoney(unpaidSum())+'</div></div>';
  h+='<div class="card"><div class="mut">Оплат</div><div class="big">'+DB.payments.filter(function(p){var d=new Date(p.ts);return d.getFullYear()===finYear&&d.getMonth()===finMonth;}).length+'</div></div></div>';
  var mp=[['all','Все'],['paid','Оплачено'],['unpaid','Ждёт оплаты']];
  h+='<div class="tabsm">'+mp.map(function(x){return '<span class="'+(finFilter===x[0]?'on':'')+'" onclick="finFilter=\''+x[0]+'\';render()">'+x[1]+'</span>';}).join('')+'</div>';
  if(finFilter==='unpaid'||finFilter==='all'){
    unpaidList().forEach(function(x){
      h+='<div class="row card"><span>'+esc(clientName(x.u))+' · '+esc(x.e.title)+' · '+fmtDate(x.e.when)+'</span><span class="tag red">'+fmtMoney(x.e.price||0)+'</span></div>';
    });
  }
  if(finFilter==='paid'||finFilter==='all'){
    DB.payments.filter(function(p){var d=new Date(p.ts);return d.getFullYear()===finYear&&d.getMonth()===finMonth;}).sort(function(a,b){return b.ts-a.ts;}).forEach(function(p){
      h+='<div class="row card"><span>'+esc(clientName(p.user))+' · '+esc(p.tariff||'оплата')+' · '+fmtDate(p.ts)+'</span><span>'+fmtMoney(p.amount)+'</span></div>';
    });
  }
  var per={};
  DB.payments.forEach(function(p){ var d=new Date(p.ts); if(d.getFullYear()===finYear&&d.getMonth()===finMonth){ per[p.user]=(per[p.user]||0)+(p.amount||0); } });
  var keys=Object.keys(per).sort(function(a,b){return per[b]-per[a];});
  if(keys.length){
    var tot=0; keys.forEach(function(k){tot+=per[k];});
    h+='<div class="panel"><b>Кто приносит деньги</b>';
    keys.forEach(function(k){
      var pct=Math.round(per[k]/tot*100);
      h+='<div class="row"><span>'+esc(clientName(k))+' — '+fmtMoney(per[k])+' ('+pct+'%)</span></div><div class="bar"><div style="width:'+pct+'%"></div></div>';
    });
    h+='</div>';
  }
  h+='<div class="panel"><b>Тарифы</b>';
  CFG.tariffs.forEach(function(t){
    h+='<div class="row"><span>'+esc(t.name)+'</span><span>'+fmtMoney(t.price)+' <button onclick="editTariff(\''+t.id+'\')">Изменить</button> <button class="danger" onclick="delTariff(\''+t.id+'\')">✕</button></span></div>';
  });
  h+='<button onclick="addTariff()">+ Добавить тариф</button></div>';
  return h;
}

  CFG.xpFood=parseInt(document.getElementById('set_xf').value)||CFG.xpFood;
  CFG.xpHabit=parseInt(document.getElementById('set_xh').value)||CFG.xpHabit;
  CFG.streakBonus=parseInt(document.getElementById('set_sb').value)||CFG.streakBonus;
  CFG.streakEvery=parseInt(document.getElementById('set_se').value)||CFG.streakEvery;
  CFG.warnDays=parseInt(document.getElementById('set_wd').value)||CFG.warnDays;

}

  var h='';
